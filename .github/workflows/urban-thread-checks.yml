name: Urban Thread checks

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests and production build
        run: npm run check
